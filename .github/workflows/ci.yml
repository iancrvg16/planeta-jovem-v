name: Validação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - run: npm ci
      - run: python -m pip install -r requirements-tools.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:conteudo
      - run: npm run test:docs
      - run: npm run test:python
      - run: npm test
      - name: Links internos no preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:links
      - run: npm audit
      - run: npm audit --omit=dev
      - run: npm run check:github
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: falhas-validacao
          path: |
            playwright-report/
            test-results/
          retention-days: 7
